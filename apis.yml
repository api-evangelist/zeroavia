aid: zeroavia
name: ZeroAvia
description: 'ZeroAvia is a UK/US hydrogen-electric aviation company founded in 2017
  by Valery Miftakhov, developing hydrogen fuel cell and electric propulsion systems
  for commercial aircraft. Its powertrain line runs from the ZA600 (600kW, 10-20 seat
  regional turboprops) through the ZA2000 (2-5MW, 40-80 seat turboprops) to the ZA2000
  RJ (5MW+, up to 90 seat regional jets), alongside a component business selling electric
  propulsion systems, inverters, electric motors and HTPEM/SuperStack fuel cell stacks
  to other clean-aviation manufacturers, plus a hydrogen airport refuelling ecosystem
  of electrolyzers, mobile refuelers and LH2 development. It operates from Cotswold
  Airport in Kemble, UK and from Everett, Washington, and holds FAA and CAA experimental
  certificates for its flight-test aircraft. ZeroAvia sells certified aerospace hardware
  to airframers, airlines, lessors and defense customers; it publishes no public developer
  API, SDK or developer portal.'
